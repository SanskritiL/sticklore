<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick a look: __TITLE__</title>
<style>
  :root {
    --page: #e8eaee;
    --text: #1b1e24;
    --soft: #5a6170;
    --line: #c3c8d1;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #15171b; --text: #e7e9ee; --soft: #a2a9b6; --line: #3a3f49; }
  }
  :root[data-theme="dark"] { --page: #15171b; --text: #e7e9ee; --soft: #a2a9b6; --line: #3a3f49; }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 16px 36px; }
  h1 { font-size: 1.35rem; font-weight: 650; margin: 0 0 4px; }
  .sub { margin: 0 0 20px; color: var(--soft); max-width: 62ch; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 20px; }
  @media (max-width: 640px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  figure { margin: 0; }
  .board { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .board svg { display: block; width: 100%; height: auto; }
  figcaption { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: baseline; padding: 10px 2px 0; }
  .num { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; grid-row: span 2; }
  .name { font-weight: 650; }
  .mood { color: var(--soft); font-size: 0.95rem; }
</style>
</head>
<body>
<main class="wrap">
  <h1>Pick a look</h1>
  <p class="sub" id="sub"></p>
  <div class="grid" id="grid"></div>
</main>

<script type="application/json" id="storyboard-data">__STORYBOARD__</script>
<script type="application/json" id="library-data">__LIBRARY__</script>
<script type="application/json" id="looks-data">__LOOKS__</script>
<script>
__RUNTIME__
</script>
<script>
(function () {
  "use strict";
  var sb = JSON.parse(document.getElementById("storyboard-data").textContent);
  var lib = JSON.parse(document.getElementById("library-data").textContent);
  var looks = JSON.parse(document.getElementById("looks-data").textContent);
  var grid = document.getElementById("grid");

  document.getElementById("sub").textContent =
    "The same moment from \u201C" + (sb.title || "your animation") +
    "\u201D in " + looks.styles.length + " styles. Reply with the number or name you like, or mix two.";

  looks.styles.forEach(function (id, i) {
    var style = lib.styles[id];
    var fig = document.createElement("figure");
    var board = document.createElement("div");
    board.className = "board";
    board.innerHTML = window.StickRT.still(sb, lib, id, looks.scene, looks.at);
    var svg = board.querySelector("svg");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", style.name + " style preview");
    svg.removeAttribute("width");
    svg.removeAttribute("height");

    var cap = document.createElement("figcaption");
    var num = document.createElement("span"); num.className = "num"; num.textContent = String(i + 1);
    var name = document.createElement("span"); name.className = "name"; name.textContent = style.name;
    var mood = document.createElement("span"); mood.className = "mood"; mood.textContent = style.mood;
    cap.appendChild(num); cap.appendChild(name); cap.appendChild(mood);
    fig.appendChild(board); fig.appendChild(cap);
    grid.appendChild(fig);
  });
})();
</script>
</body>
</html>
